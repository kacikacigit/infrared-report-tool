name: 打包 Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 准备 Tesseract 便携版（放 exe 旁边，不打进 exe）
        shell: powershell
        run: |
          choco install tesseract --no-progress
          $srcDir = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$srcDir\tesseract.exe")) { $srcDir = "C:\Program Files (x86)\Tesseract-OCR" }
          mkdir tesseract\tessdata -Force
          copy "$srcDir\*.exe" tesseract\
          copy "$srcDir\*.dll" tesseract\
          copy "$srcDir\tessdata\eng.traineddata" tesseract\tessdata\
          copy "$srcDir\tessdata\chi_sim.traineddata" tesseract\tessdata\ -ErrorAction SilentlyContinue
          if (-not (Test-Path "tesseract\tessdata\chi_sim.traineddata")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/chi_sim.traineddata" -OutFile "tesseract\tessdata\chi_sim.traineddata"
          }
          Write-Host "Tesseract portable ready"

      - name: 打包 91号文脚本（不内嵌 Tesseract）
        run: |
          pyinstaller --onefile --name "91号文报告自动生成" "报告填写项目-claude-91号文/终端版claude/91号文报告自动生成-终端版V5.py"

      - name: 打包 43号文脚本
        run: |
          pyinstaller --onefile --name "43号文红外测温报告自动生成" "报告填写项目_claude-43号文/43号文报告自动生成-claude-v6.py"

      - name: 打包 生成测温记录脚本
        run: |
          pyinstaller --onefile --name "生成测温记录" "报告填写项目_claude-43号文/生成测温记录-V2.py"

      - name: 组装分发包
        run: |
          mkdir dist\分发包\91号文
          mkdir dist\分发包\43号文
          copy dist\91号文报告自动生成.exe dist\分发包\91号文\
          copy dist\43号文红外测温报告自动生成.exe dist\分发包\43号文\
          copy dist\生成测温记录.exe dist\分发包\43号文\
          xcopy tesseract dist\分发包\91号文\tesseract\ /E /I /Y >nul 2>&1 || (echo 91号文 tesseract copy failed & exit /b 1)
          xcopy tesseract dist\分发包\43号文\tesseract\ /E /I /Y >nul 2>&1 || (echo 43号文 tesseract copy failed & exit /b 1)
          echo 使用说明： > dist\分发包\使用说明.txt
          echo 本工具已内置 Tesseract OCR 引擎，无需额外安装任何软件。 >> dist\分发包\使用说明.txt
          echo 进入 91号文 或 43号文 文件夹，放入图谱和模板文件，双击 exe 即可使用。 >> dist\分发包\使用说明.txt

      - name: 上传分发包
        uses: actions/upload-artifact@v4
        with:
          name: 红外测温报告工具-Windows
          path: dist/分发包/**
