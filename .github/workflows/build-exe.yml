name: 打包 Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 安装 Tesseract OCR
        run: |
          choco install tesseract --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 打包 91号文脚本
        run: |
          pyinstaller --onefile --name "91号文报告自动生成" "报告填写项目-claude-91号文/终端版claude/91号文报告自动生成-终端版V5.py"

      - name: 下载 Tesseract 安装程序
        run: |
          curl -L -o dist/tesseract-ocr-w64-setup.exe "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe"
          echo Tesseract installer downloaded

      - name: 打包 43号文脚本
        run: |
          pyinstaller --onefile --name "43号文红外测温报告自动生成" "报告填写项目_claude-43号文/43号文报告自动生成-claude-v6.py"

      - name: 打包 生成测温记录脚本
        run: |
          pyinstaller --onefile --name "生成测温记录" "报告填写项目_claude-43号文/生成测温记录-V2.py"

      - name: 组装分发包
        run: |
          mkdir dist\分发包\91号文
          mkdir dist\分发包\43号文
          copy dist\91号文报告自动生成.exe dist\分发包\91号文\
          copy dist\43号文红外测温报告自动生成.exe dist\分发包\43号文\
          copy dist\生成测温记录.exe dist\分发包\43号文\
          copy dist\tesseract-ocr-w64-setup.exe dist\分发包\
          copy 安装向导.bat dist\分发包\
          echo 第一步：安装Tesseract OCR引擎 > dist\分发包\安装前必读.txt
          echo 如果 tesseract-ocr-w64-setup.exe 打不开或缺失，请从以下地址下载： >> dist\分发包\安装前必读.txt
          echo https://github.com/tesseract-ocr/tesseract/releases >> dist\分发包\安装前必读.txt
          echo 下载 tesseract-ocr-w64-setup-5.5.0.20241111.exe 安装时勾选中文简体 >> dist\分发包\安装前必读.txt
          echo. >> dist\分发包\安装前必读.txt
          echo 装完后，进入91号文或43号文文件夹，双击exe即可使用 >> dist\分发包\安装前必读.txt

      - name: 上传分发包
        uses: actions/upload-artifact@v4
        with:
          name: 红外测温报告工具-Windows
          path: dist/分发包/**
