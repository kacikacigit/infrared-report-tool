name: 打包 Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 准备内嵌 Tesseract 便携版
        shell: cmd
        run: |
          choco install tesseract --no-progress
          mkdir tesseract\tessdata
          if exist "C:\Program Files\Tesseract-OCR\tesseract.exe" (
            copy "C:\Program Files\Tesseract-OCR\tesseract.exe" tesseract\
            copy "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata" tesseract\tessdata\
            copy "C:\Program Files\Tesseract-OCR\tessdata\chi_sim.traineddata" tesseract\tessdata\
          ) else if exist "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe" (
            copy "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe" tesseract\
            copy "C:\Program Files (x86)\Tesseract-OCR\tessdata\eng.traineddata" tesseract\tessdata\
            copy "C:\Program Files (x86)\Tesseract-OCR\tessdata\chi_sim.traineddata" tesseract\tessdata\
          ) else (
            echo ERROR: Cannot find tesseract.exe
            dir /s "C:\Program Files\Tesseract-OCR\tesseract.exe"
            dir /s "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe"
            exit /b 1
          )
          if exist tesseract\tesseract.exe (echo Tesseract portable ready) else (echo Tesseract prep failed & exit /b 1)

      - name: 打包 91号文脚本（内嵌 Tesseract）
        run: |
          pyinstaller --onefile --name "91号文报告自动生成" --add-data "tesseract;tesseract" "报告填写项目-claude-91号文/终端版claude/91号文报告自动生成-终端版V5.py"

      - name: 打包 43号文脚本（内嵌 Tesseract）
        run: |
          pyinstaller --onefile --name "43号文红外测温报告自动生成" --add-data "tesseract;tesseract" "报告填写项目_claude-43号文/43号文报告自动生成-claude-v6.py"

      - name: 打包 生成测温记录脚本
        run: |
          pyinstaller --onefile --name "生成测温记录" "报告填写项目_claude-43号文/生成测温记录-V2.py"

      - name: 组装分发包
        run: |
          mkdir dist\分发包\91号文
          mkdir dist\分发包\43号文
          copy dist\91号文报告自动生成.exe dist\分发包\91号文\
          copy dist\43号文红外测温报告自动生成.exe dist\分发包\43号文\
          copy dist\生成测温记录.exe dist\分发包\43号文\
          echo 使用说明： > dist\分发包\使用说明.txt
          echo 本工具已内嵌 Tesseract OCR，无需额外安装。 >> dist\分发包\使用说明.txt
          echo 1. 将本文件夹拷贝到工作目录 >> dist\分发包\使用说明.txt
          echo 2. 进入91号文或43号文文件夹 >> dist\分发包\使用说明.txt
          echo 3. 放入红外图片到"图谱"文件夹 >> dist\分发包\使用说明.txt
          echo 4. 填写"必填信息.xlsx" >> dist\分发包\使用说明.txt
          echo 5. 双击 exe，按菜单选择操作 >> dist\分发包\使用说明.txt

      - name: 上传分发包
        uses: actions/upload-artifact@v4
        with:
          name: 红外测温报告工具-Windows
          path: dist/分发包/**
